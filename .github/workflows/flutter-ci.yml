name: Flutter CI

# Cada push a ramas de desarrollo valida el código (analyze + test).
# En main (o manualmente) se construye además el APK y se sube como
# artefacto del workflow.
on:
  push:
    branches: [main, 'arena/**', 'refactor/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        if: hashFiles('test/**') != ''
        run: flutter test

  build-apk:
    name: Build APK (release)
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter build apk --release
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
