name: Flutter CI

# Cada push valida el código (pub get + analyze + test). En main (o
# manualmente) se construye además el APK y se sube como artefacto.
#
# Diseño de la verificación (aprendido a base de fails):
# - Los pasos `flutter pub get` / `flutter analyze` / `flutter test` /
#   `flutter build` son los GATES: sin `continue-on-error`, sin `|| true`.
#   Si fallan, el job falla.
# - Los pasos de anotación son BEST-EFFORT (siempre terminan en `|| true`):
#   publican la salida real como anotaciones del check-run y en el step
#   summary, que sí son legibles vía API cuando el log crudo del runner no
#   está accesible. Un fallo del sistema de anotación NUNCA enmascarará el
#   resultado real del gate.
on:
  push:
    branches: [main, 'arena/**', 'refactor/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # GATE 1: dependencias
      - name: Flutter pub get
        run: flutter pub get

      # GATE 2: analyze (error y warning fatals, como por defecto)
      - name: Flutter analyze
        run: |
          flutter analyze --no-pub 2>&1 | tee analyze_human.txt
          exit ${PIPESTATUS[0]}

      # Best effort: resultados como anotaciones + step summary
      - name: Annotate analyze
        if: always()
        run: |
          flutter analyze --no-pub --machine > analyze_machine.jsonl 2>&1 || true
          python3 .github/scripts/ci_annotate.py --mode analyze || true
          cat analyze_human.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # La salida real del analyzer como artefacto (los logs crudos del
      # runner y las summaries no siempre son accesibles vía API con el
      # token de la sesión; el artefacto SÍ se puede descargar).
      - name: Upload analyze logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-logs
          path: |
            analyze_human.txt
            analyze_machine.jsonl
          if-no-files-found: ignore
          retention-days: 7

      # Canal de depuración: si el job falla, publica la salida real en la
      # rama especial `ci-logs` (NO dispara este workflow: solo corre en
      # main/arena/**/refactor/**). Desde fuera se lee con
      #   git fetch origin ci-logs && git show origin/ci-logs:run-<id>/analyze_human.txt
      # (los artifacts y logs crudos no siempre son accesibles desde el
      # entorno de trabajo; una rama git sí).
      - name: Publish logs to ci-logs branch
        if: failure()
        run: |
          set +e
          mkdir -p .ci-logs/run-"$GITHUB_RUN_ID"
          cp analyze_human.txt analyze_machine.jsonl .ci-logs/run-"$GITHUB_RUN_ID"/ 2>/dev/null
          printf 'run=%s\nsha=%s\nbranch=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REF_NAME" > .ci-logs/run-"$GITHUB_RUN_ID"/meta.txt
          cd .ci-logs
          git init -q
          git config user.name "ci-logs"
          git config user.email "ci-logs@calai"
          git add -A
          git commit -q -m "CI logs run $GITHUB_RUN_ID"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs \
            && echo "ci-logs: publicado run $GITHUB_RUN_ID" \
            || echo "ci-logs: no se pudo publicar (sin permisos?)"

      # GATE 3: tests (solo cuando ya existe test/)
      - name: Flutter test
        if: hashFiles('test/**') != ''
        run: flutter test

      # Best effort: resultados de test como anotaciones
      - name: Annotate test
        if: always() && hashFiles('test/**') != ''
        run: |
          flutter test > test_human.txt 2>&1 || true
          python3 .github/scripts/ci_annotate.py --mode tail --file test_human.txt || true
          tail -n 40 test_human.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload test logs
        if: always() && hashFiles('test/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test_human.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish test logs to ci-logs branch
        if: failure() && hashFiles('test/**') != ''
        run: |
          set +e
          mkdir -p .ci-logs/run-"$GITHUB_RUN_ID"
          cp test_human.txt .ci-logs/run-"$GITHUB_RUN_ID"/ 2>/dev/null
          cd .ci-logs
          git init -q
          git config user.name "ci-logs"
          git config user.email "ci-logs@calai"
          git add -A
          git commit -q -m "CI test logs run $GITHUB_RUN_ID"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs \
            && echo "ci-logs: publicado run $GITHUB_RUN_ID" \
            || echo "ci-logs: no se pudo publicar (sin permisos?)"

  build-apk:
    name: Build APK (release)
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # GATE 4: build de release
      - name: Flutter build apk --release
        run: |
          flutter build apk --release 2>&1 | tee build_human.txt
          exit ${PIPESTATUS[0]}

      # Best effort: resumen del build como anotación
      - name: Annotate build
        if: always()
        run: |
          python3 .github/scripts/ci_annotate.py --mode tail --file build_human.txt || true
          tail -n 40 build_human.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: APK info
        if: success()
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
