name: Flutter CI

# Cada push valida el código (pub get + analyze + test). En main (o
# manualmente) se construye además el APK y se sube como artefacto.
#
# Diseño de la verificación (aprendido a base de fails):
# - Los pasos `flutter pub get` / `flutter analyze` / `flutter test` /
#   `flutter build` son los GATES: sin `continue-on-error`, sin `|| true`.
#   Si fallan, el job falla.
# - Los pasos de anotación son BEST-EFFORT (siempre terminan en `|| true`):
#   publican la salida real como anotaciones del check-run y en el step
#   summary, que sí son legibles vía API cuando el log crudo del runner no
#   está accesible. Un fallo del sistema de anotación NUNCA enmascarará el
#   resultado real del gate.
on:
  push:
    branches: [main, 'arena/**', 'refactor/**']
  pull_request:
  workflow_dispatch:

# El token GITHUB_TOKEN de Actions necesita `contents: write` para poder
# publicar los logs en la rama ci-logs al fallar (sin permissions: explícito
# solo tiene read y el push no funciona).
permissions:
  contents: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # GATE 1: dependencias
      - name: Flutter pub get
        run: flutter pub get

      # GATE 2: analyze (error y warning fatals, como por defecto)
      - name: Flutter analyze
        run: |
          flutter analyze --no-pub 2>&1 | tee analyze_human.txt
          exit ${PIPESTATUS[0]}

      # Best effort: resultados como anotaciones + step summary
      - name: Annotate analyze
        if: always()
        run: |
          flutter analyze --no-pub --machine > analyze_machine.jsonl 2>&1 || true
          python3 .github/scripts/ci_annotate.py --mode analyze || true
          cat analyze_human.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # La salida real del analyzer como artefacto (los logs crudos del
      # runner y las summaries no siempre son accesibles vía API con el
      # token de la sesión; el artefacto SÍ se puede descargar).
      - name: Upload analyze logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-logs
          path: |
            analyze_human.txt
            analyze_machine.jsonl
          if-no-files-found: ignore
          retention-days: 7

      # Canal de depuración principal: si el job falla, la salida REAL de
      # flutter analyze se publica como cuerpo de una RELEASE DRAFT
      # (tag ci-debug). Es el único canal que funciona de punta a punta:
      # los artifacts y logs crudos no son accesibles desde el entorno de
      # trabajo (bloqueo de red), el push a rama fallaba, y las anotaciones
      # del check-run las sobreescribe el runner al terminar. Desde fuera:
      #   gh api repos/<owner>/<repo>/releases/tags/ci-debug --jq .body
      - name: Publish analyze logs as draft release (debug channel)
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          token = os.environ.get("GITHUB_TOKEN", "")
          try:
              with open("analyze_human.txt", encoding="utf-8", errors="replace") as f:
                  body = f.read()
          except FileNotFoundError:
              body = "(sin analyze_human.txt)"
          header = (
              "Salida REAL de `flutter analyze` (run "
              + os.environ.get("GITHUB_RUN_ID", "?")
              + ", sha " + os.environ.get("GITHUB_SHA", "?")[:7] + ")\n\n"
          )
          payload = {
              "tag_name": "ci-debug",
              "name": "CI debug (run " + os.environ.get("GITHUB_RUN_ID", "?") + ")",
              "draft": True,
              "target_commitish": os.environ.get("GITHUB_SHA", ""),
              "body": (header + body)[:900000],
          }
          req = urllib.request.Request(
              "https://api.github.com/repos/"
              + os.environ.get("GITHUB_REPOSITORY", "")
              + "/releases/tags/ci-debug",
              data=json.dumps(payload).encode(),
              method="PUT",
          )
          req.add_header("Authorization", "Bearer " + token)
          req.add_header("Accept", "application/vnd.github+json")
          req.add_header("Content-Type", "application/json")
          try:
              with urllib.request.urlopen(req) as r:
                  print("release ci-debug actualizada:", r.status)
          except Exception as e:
              print("no se pudo publicar la release ci-debug:", e)
          PYEOF

      # GATE 3: tests (solo cuando ya existe test/)
      - name: Flutter test
        if: hashFiles('test/**') != ''
        run: flutter test

      # Best effort: resultados de test como anotaciones
      - name: Annotate test
        if: always() && hashFiles('test/**') != ''
        run: |
          flutter test > test_human.txt 2>&1 || true
          python3 .github/scripts/ci_annotate.py --mode tail --file test_human.txt || true
          tail -n 40 test_human.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload test logs
        if: always() && hashFiles('test/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test_human.txt
          if-no-files-found: ignore
          retention-days: 7

      # Misma vía que el canal de analyze: la salida REAL de flutter test
      # como release draft (tag ci-debug-test).
      - name: Publish test logs as draft release (debug channel)
        if: failure() && hashFiles('test/**') != ''
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          token = os.environ.get("GITHUB_TOKEN", "")
          try:
              with open("test_human.txt", encoding="utf-8", errors="replace") as f:
                  body = f.read()
          except FileNotFoundError:
              body = "(sin test_human.txt)"
          header = (
              "Salida REAL de `flutter test` (run "
              + os.environ.get("GITHUB_RUN_ID", "?")
              + ", sha " + os.environ.get("GITHUB_SHA", "?")[:7] + ")\n\n"
          )
          payload = {
              "tag_name": "ci-debug-test",
              "name": "CI test debug (run " + os.environ.get("GITHUB_RUN_ID", "?") + ")",
              "draft": True,
              "target_commitish": os.environ.get("GITHUB_SHA", ""),
              "body": (header + body)[:900000],
          }
          req = urllib.request.Request(
              "https://api.github.com/repos/"
              + os.environ.get("GITHUB_REPOSITORY", "")
              + "/releases/tags/ci-debug-test",
              data=json.dumps(payload).encode(),
              method="PUT",
          )
          req.add_header("Authorization", "Bearer " + token)
          req.add_header("Accept", "application/vnd.github+json")
          req.add_header("Content-Type", "application/json")
          try:
              with urllib.request.urlopen(req) as r:
                  print("release ci-debug-test actualizada:", r.status)
          except Exception as e:
              print("no se pudo publicar la release ci-debug-test:", e)
          PYEOF

  # Build del APK: en main, en workflow_dispatch manual y en tags v*
  # (los tags alimentan el job de release de abajo).
  build-apk:
    name: Build APK (release)
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # GATE 4: build de release
      - name: Flutter build apk --release
        run: |
          flutter build apk --release 2>&1 | tee build_human.txt
          exit ${PIPESTATUS[0]}

      # Best effort: resumen del build como anotación
      - name: Annotate build
        if: always()
        run: |
          python3 .github/scripts/ci_annotate.py --mode tail --file build_human.txt || true
          tail -n 40 build_human.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: APK info
        if: success()
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # Release: solo en tags v*. Crea la GitHub Release del tag con el APK
  # descargado del artefacto del build (no re-build).
  release-apk:
    name: Release (tag v*)
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: calai-release-apk
          path: apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/app-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
