name: Flutter CI

# Cada push valida el código (pub get + analyze + test). En main (o
# manualmente) se construye además el APK y se sube como artefacto.
#
# Los pasos clave capturan su salida y la publican como anotaciones del
# check-run (.github/scripts/ci_annotate.py) para que los resultados sean
# legibles vía API aunque el log crudo del runner no esté disponible.
on:
  push:
    branches: [main, 'arena/**', 'refactor/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        id: pubget
        continue-on-error: true
        run: flutter pub get > pubget_output.txt 2>&1 || true

      - name: "Gate: pub get"
        if: always()
        run: >
          python3 .github/scripts/ci_annotate.py --mode tail
          --file pubget_output.txt
          --exit-code ${{ steps.pubget.outcome == 'success' && 0 || 1 }}

      - name: Flutter analyze
        id: analyze
        if: steps.pubget.outcome == 'success'
        continue-on-error: true
        run: |
          flutter analyze --no-pub --machine > analyze_machine.jsonl 2>&1 || true
          flutter analyze --no-pub > analyze_human.txt 2>&1 || true
          echo '================ flutter analyze ================'
          cat analyze_human.txt

      - name: "Gate: analyze"
        if: always() && steps.pubget.outcome == 'success'
        run: python3 .github/scripts/ci_annotate.py --mode analyze

      - name: Flutter test
        id: test
        if: hashFiles('test/**') != ''
        continue-on-error: true
        run: flutter test > test_output.txt 2>&1 || true

      - name: "Gate: test"
        if: hashFiles('test/**') != ''
        run: >
          python3 .github/scripts/ci_annotate.py --mode tail
          --file test_output.txt
          --exit-code ${{ steps.test.outcome == 'success' && 0 || 1 }}

  build-apk:
    name: Build APK (release)
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter build apk --release
        id: build
        continue-on-error: true
        run: flutter build apk --release > build_output.txt 2>&1 || true

      - name: "Gate: build"
        if: always()
        run: >
          python3 .github/scripts/ci_annotate.py --mode tail
          --file build_output.txt
          --exit-code ${{ steps.build.outcome == 'success' && 0 || 1 }}

      - name: APK info
        if: success()
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: calai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
