name: Flutter CI

# Cada push valida el código (pub get + analyze + test). En main (o
# manualmente) se construye además el APK y se sube como artefacto.
#
# Diseño de la verificación (aprendido a base de fails):
# - Los pasos `flutter pub get` / `flutter analyze` / `flutter test` /
#   `flutter build` son los GATES: sin `continue-on-error`, sin `|| true`.
#   Si fallan, el job falla.
# - Los pasos de anotación son BEST-EFFORT (siempre terminan en `|| true`):
#   publican la salida real como anotaciones del check-run y en el step
#   summary, que sí son legibles vía API cuando el log crudo del runner no
#   está accesible. Un fallo del sistema de anotación NUNCA enmascarará el
#   resultado real del gate.
on:
  push:
    branches: [main, 'arena/**', 'refactor/**']
    # Los tags v* disparan el build + el job de release (un push de tag no
    # encaja en el filtro de ramas).
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# El token GITHUB_TOKEN de Actions necesita `contents: write` para poder
# publicar los logs en la rama ci-logs al fallar (sin permissions: explícito
# solo tiene read y el push no funciona).
permissions:
  contents: write
  checks: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # GATE 1: dependencias
      - name: Flutter pub get
        run: flutter pub get

      # GATE 2: analyze (error y warning fatals, como por defecto)
      - name: Flutter analyze
        run: |
          flutter analyze --no-pub 2>&1 | tee analyze_human.txt
          exit ${PIPESTATUS[0]}

      # Best effort: resultados como anotaciones + step summary
      - name: Annotate analyze
        if: always()
        run: |
          flutter analyze --no-pub --machine > analyze_machine.jsonl 2>&1 || true
          python3 .github/scripts/ci_annotate.py --mode analyze || true
          # Mantiene el diagnóstico visible incluso cuando GitHub no expone
          # el log crudo del runner a la API de la sesión.
          python3 - <<'PY'
          from pathlib import Path
          text = Path('analyze_human.txt').read_text(errors='replace')[-60000:]
          if text.strip() and 'No issues found!' not in text:
              encoded = (text.replace('%', '%25')
                         .replace('\r', '%0D')
                         .replace('\n', '%0A'))
              print('::error file=.github/workflows/flutter-ci.yml,line=1::' + encoded)
          PY
          cat analyze_human.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # La salida real del analyzer como artefacto (los logs crudos del
      # runner y las summaries no siempre son accesibles vía API con el
      # token de la sesión; el artefacto SÍ se puede descargar).
      - name: Upload analyze logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-logs
          path: |
            analyze_human.txt
            analyze_machine.jsonl
          if-no-files-found: ignore
          retention-days: 7

      # GATE 3: tests (solo cuando ya existe test/)
      - name: Flutter test
        if: hashFiles('test/**') != ''
        run: flutter test

      # Best effort: resultados de test como anotaciones
      - name: Annotate test
        if: always() && hashFiles('test/**') != ''
        run: |
          flutter test > test_human.txt 2>&1 || true
          python3 .github/scripts/ci_annotate.py --mode tail --file test_human.txt || true
          tail -n 40 test_human.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload test logs
        if: always() && hashFiles('test/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test_human.txt
          if-no-files-found: ignore
          retention-days: 7

  # Build del APK: en main, en workflow_dispatch manual y en tags v*
  # (los tags alimentan el job de release de abajo).
  build-apk:
    name: Build APK (release)
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # GATE 4: build de release
      - name: Flutter build apk --release
        run: |
          flutter build apk --release 2>&1 | tee build_human.txt
          exit ${PIPESTATUS[0]}

      # Best effort: resumen del build como anotación
      - name: Annotate build
        if: always()
        run: |
          python3 .github/scripts/ci_annotate.py --mode tail --file build_human.txt || true
          tail -n 40 build_human.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: APK info
        if: success()
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Cada APK exitoso crea su propia Release, como en app-aula. El número
      # de ejecución hace único el tag aunque aún no se haya cambiado la
      # versión de pubspec.yaml. Solo se publica el APK; no se suben logs.
      - name: Prepare versioned APK Release
        if: success()
        run: |
          set -euo pipefail
          VERSION=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          echo "RELEASE_TAG=apk-v${VERSION}-build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=CalAI v${VERSION} · APK build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          ASSET="CalAI-v${VERSION}-build-${GITHUB_RUN_NUMBER}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$ASSET"
          echo "RELEASE_ASSET=$ASSET" >> "$GITHUB_ENV"
          # El cuerpo de la Release solo identifica el descargable. Los
          # detalles de CI y los hashes permanecen fuera de la Release.
          printf '%s\n' 'APK de CalAI para descargar.' > release-notes.md

      - name: Publish versioned APK Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: release-notes.md
          target_commitish: ${{ github.sha }}
          files: ${{ env.RELEASE_ASSET }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
