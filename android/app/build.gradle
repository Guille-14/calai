plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    // Paquete propio (antes com.example.ai_calorie_tracker). MainActivity.kt
    // vive en com/guillermo/calai/ para que coincida con el namespace.
    namespace = "com.guillermo.calai"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.guillermo.calai"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            // FIRMA DEBUG A PROPOSITO (no es un olvido):
            // El APK de release se firma con la clave de debug porque es
            // una instalacion PERSONAL (AAB/APK lateral, sin Play Store).
            // Si en algun momento se va a publicar en la Play Store, hay que
            // generar un keystore propio y sustituir esto por:
            //   signingConfig = signingConfigs.release
            // con las credenciales del keystore en android/key.properties.
            // Mientras tanto NO generar un keystore nuevo: al no haber
            // actualizaciones previas, firmar de debug no rompe nada.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    // Health Connect SDK: lo aporta el propio plugin `health` (alpha11).
    // NO forzar otra versión aquí: un mismatch de alpha causa crash JNI
    // en arranque (NoSuchMethodError antes de ejecutar código Dart).
}
